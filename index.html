
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBTI로 포켓몬 찾기</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #fff9e9;
      color: #493b2a;
      font-size: 18px;
      line-height: 1.7;
    }

    button {
      font: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      padding: 20px 10px 28px;
    }

    .header-icon {
      font-size: 54px;
      line-height: 1.3;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.35;
      color: #5c4728;
    }

    .subtitle {
      margin: 0;
      color: #806e55;
      font-size: 18px;
    }

    .panel {
      background: #fff;
      border: 2px solid #f3e4bd;
      border-radius: 24px;
      padding: 26px;
      box-shadow: 0 8px 22px rgba(110, 82, 35, 0.06);
    }

    .section-title {
      margin: 0 0 6px;
      font-size: 25px;
      color: #5c4728;
    }

    .section-description {
      margin: 0 0 20px;
      color: #82725d;
      font-size: 16px;
    }

    .mbti-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .mbti-button {
      min-height: 58px;
      border: 2px solid #f0e0b8;
      border-radius: 14px;
      background: #fffaf0;
      color: #5c4728;
      font-size: 19px;
      font-weight: bold;
      transition: background 0.15s, transform 0.15s;
    }

    .mbti-button:hover {
      background: #fff0bd;
      border-color: #e7c76e;
      transform: translateY(-2px);
    }

    button:focus-visible {
      outline: 3px solid #a77b29;
      outline-offset: 3px;
    }

    .result {
      text-align: center;
    }

    .result-label {
      display: inline-block;
      padding: 6px 16px;
      margin-bottom: 12px;
      border-radius: 30px;
      background: #fff0bd;
      color: #77551b;
      font-size: 16px;
      font-weight: bold;
    }

    .pokemon-image-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 240px;
      height: 240px;
      max-width: 100%;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #fff5d5;
      overflow: hidden;
    }

    .pokemon-image {
      display: block;
      width: 90%;
      height: 90%;
      object-fit: contain;
      transition: transform 0.2s;
    }

    .pokemon-image:hover {
      transform: scale(1.06);
    }

    .image-fallback {
      padding: 20px;
      color: #8b7656;
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .pokemon-name {
      margin: 8px 0 4px;
      font-size: 34px;
      color: #574020;
    }

    .pokemon-type {
      margin: 0 0 22px;
      color: #8b7656;
      font-size: 17px;
    }

    .reason-card {
      padding: 20px;
      margin: 0 0 16px;
      border-radius: 18px;
      background: #fffaf0;
      text-align: left;
    }

    .reason-card h3 {
      margin: 0 0 8px;
      font-size: 21px;
      color: #765522;
    }

    .reason-card p {
      margin: 0;
      white-space: pre-line;
      font-size: 18px;
    }

    .compatibility {
      padding: 20px;
      border-radius: 18px;
      background: #fff0bd;
    }

    .compatibility h3 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .compatibility-type {
      display: inline-block;
      margin: 6px 0;
      padding: 5px 18px;
      border: 2px solid #e7c76e;
      border-radius: 30px;
      background: #fffdf6;
      font-size: 24px;
      font-weight: bold;
    }

    .compatibility p {
      margin: 4px 0 0;
      font-size: 16px;
    }

    .reset-button {
      display: block;
      width: 100%;
      margin-top: 22px;
      padding: 15px 20px;
      border: none;
      border-radius: 14px;
      background: #edc85f;
      color: #493817;
      font-size: 19px;
      font-weight: bold;
    }

    .reset-button:hover {
      background: #e4b940;
    }

    .footer {
      margin: 24px 0 0;
      text-align: center;
      color: #9a896f;
      font-size: 14px;
    }

    .footer a {
      color: #80612c;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 12px 10px;
      }

      .panel {
        padding: 18px 14px;
        border-radius: 20px;
      }

      .mbti-grid {
        gap: 8px;
      }

      .mbti-button {
        min-height: 52px;
        font-size: 17px;
      }

      .pokemon-image-box {
        width: 200px;
        height: 200px;
      }

      .pokemon-name {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header">
      <div class="header-icon" aria-hidden="true">🌟 ⚡</div>
      <h1>MBTI로 포켓몬 찾기</h1>
      <p class="subtitle">
        나와 닮은 포켓몬은 누구일까?<br>
        내 MBTI를 선택하고 확인해 보세요!
      </p>
    </header>

    <!-- MBTI 선택 화면 -->
    <section class="panel" id="selection">
      <h2 class="section-title">🎯 나의 MBTI는?</h2>
      <p class="section-description">
        16가지 유형 중 나에게 해당하는 유형을 눌러 보세요.
      </p>
      <div class="mbti-grid" id="mbtiGrid"></div>
    </section>

    <!-- 포켓몬 결과 화면 -->
    <section class="panel result" id="result" hidden>
      <div class="result-label" id="resultMbti"></div>

      <div class="pokemon-image-box" id="pokemonImageBox">
        <div class="image-fallback">포켓몬 이미지를 준비하고 있어요.</div>
      </div>

      <h2 class="pokemon-name" id="pokemonName"></h2>
      <p class="pokemon-type" id="pokemonType"></p>

      <div class="reason-card">
        <h3>💛 나와 닮은 이유</h3>
        <p id="reason"></p>
      </div>

      <div class="compatibility">
        <h3>🤝 나와 잘 맞는 MBTI</h3>
        <div class="compatibility-type" id="compatibilityType"></div>
        <p id="compatibilityReason"></p>
      </div>

      <button class="reset-button" id="resetButton" type="button">
        ↩ 다시 고르기
      </button>
    </section>

    <footer class="footer">
      포켓몬 이미지 출처:
      <a href="https://github.com/PokeAPI/sprites"
         target="_blank" rel="noopener noreferrer">PokéAPI Sprites</a>
      <br>
      포켓몬과 MBTI의 성격을 연결한 재미용 콘텐츠입니다. 😊
    </footer>

  </main>

  <script>
    // 포켓몬 이미지 주소
    const IMAGE_URLS = {

        partnerReason:

          "INTP는 논리와 새로운 아이디어를 더해 줄 수 있어요."
      },

      ESTP: {
        name: "리자몽",
        id: 6,
        type: "대담하고 행동력이 뛰어난 타입",
        reason:
          "망설이기보다 직접 도전하며 경험을 쌓는 편이에요.\n" +
          "순간적인 판단력과 강한 추진력이 매력적이에요.",
        partner: "ISFJ",
        partnerReason:
          "ISFJ의 세심함이 도전을 안정적으로 뒷받침하고,\n" +
          "ESTP는 일상에 활력과 새로운 경험을 더해 줘요."
      },

        name: "피카츄",
        id: 25,

        reason:
          "친구들과 함께 즐거운 순간을 만드는 걸 좋아해요.\n" +
          "밝은 에너지와 친근함으로 주변 분위기를 환하게 해 줘요.",
        partner: "ISTJ",
        partnerReason:
          "ISTJ의 차분함이 든든한 안정감을 주고,\n" +
          "ESFP의 활기찬 성격이 일상에 즐거움을 더해 줘요."
      },

      ENFP: {
        name: "토게피",
        id: 175,
        type: "호기심 많고 열정적인 타입",
        reason:
          "새로운 만남과 가능성에 마음이 설레는 편이에요.\n" +
          "긍정적인 에너지와 풍부한 상상력으로 주변에 즐거움을 줘요.",
        partner: "INTJ",
        partnerReason:
          "INTJ의 체계적인 생각이 아이디어를 구체화해 주고,\n" +

        partner: "INFJ",
        partnerReason:
          "INFJ의 깊이 있는 통찰이 아이디어에 방향을 더하고,\n" +
          "ENTP는 새로운 가능성을 열어 주며 생각을 확장해 줘요."

        partner: "INFP",
        partnerReason:
          "INFP의 진솔한 생각과 감정이 서로를 깊이 이해하게 하고,\n" +
          "ENFJ의 응원은 INFP가 꿈을 펼치는 데 힘이 될 수 있어요."
      },

      ENTJ: {
        name: "레쿠쟈",
        id: 384,
        type: "목표 지향적이고 결단력 있는 타입",
        reason:
          "큰 목표를 세우고 과감하게 앞으로 나아가는 편이에요.\n" +
          "상황을 파악하고 방향을 결정하는 리더십이 닮았어요.",
        partner: "INTP",
        partnerReason:
          "INTP의 깊이 있는 분석이 계획을 더욱 탄탄하게 만들고,\n" +
          "ENTJ의 추진력이 좋은 아이디어를 현실로 연결해 줘요."
      }
    };

    const mbtiTypes = [
      "ISTJ", "ISFJ", "INFJ", "INTJ",
      "ISTP", "ISFP", "INFP", "INTP",
      "ESTP", "ESFP", "ENFP", "ENTP",
      "ESTJ", "ESFJ", "ENFJ", "ENTJ"
    ];

    const selection = document.getElementById("selection");
    const result = document.getElementById("result");
    const mbtiGrid = document.getElementById("mbtiGrid");
    const resetButton = document.getElementById("resetButton");
    const pokemonImageBox = document.getElementById("pokemonImageBox");

    // MBTI 버튼 16개 만들기
    mbtiTypes.forEach(function(type) {
      const button = document.createElement("button");

      button.type = "button";
      button.className = "mbti-button";
      button.textContent = type;
      button.setAttribute("aria-label", type + " 선택");

      button.addEventListener("click", function() {
        showResult(type);
      });

      mbtiGrid.appendChild(button);
    });

    // 이미지 로드 실패 시 다른 주소로 자동 재시도
    function showPokemonImage(data) {
      pokemonImageBox.replaceChildren();

      const img = document.createElement("img");
      img.className = "pokemon-image";
      img.alt = data.name + " 포켓몬 이미지";
      img.loading = "eager";
      img.referrerPolicy = "no-referrer";

      const urls = [
        IMAGE_URLS.artwork + data.id + ".png",
        IMAGE_URLS.sprite + data.id + ".png"
      ];

      let index = 0;

      function showFallback() {
        pokemonImageBox.replaceChildren();

        const message = document.createElement("div");
        message.className = "image-fallback";
        message.textContent =
          "이미지를 불러올 수 없습니다.\n" +
          "인터넷 연결이나 이미지 사이트 접근을 확인해 주세요.";

        pokemonImageBox.appendChild(message);
      }

      function tryNextImage() {
        if (index >= urls.length) {
          showFallback();
          return;
        }

        const currentUrl = urls[index];
        index++;

        img.onload = function() {
          img.style.display = "block";
        };

        img.onerror = function() {
          tryNextImage();
        };

        img.src = currentUrl;
      }

      pokemonImageBox.appendChild(img);
      tryNextImage();
    }

    // 선택한 MBTI 결과 표시
    function showResult(type) {
      const data = pokemonData[type];

      document.getElementById("resultMbti").textContent =
        "나의 MBTI · " + type;

      document.getElementById("pokemonName").textContent =
        data.name;

      document.getElementById("pokemonType").textContent =
        data.type;

      document.getElementById("reason").textContent =
        data.reason;

      document.getElementById("compatibilityType").textContent =
        data.partner;

      document.getElementById("compatibilityReason").textContent =
        data.partnerReason;

      showPokemonImage(data);

      selection.hidden = true;
      result.hidden = false;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      resetButton.focus({ preventScroll: true });
    }

    // 다시 선택하기
    resetButton.addEventListener("click", function() {
      result.hidden = true;
      selection.hidden = false;

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      const firstButton = mbtiGrid.querySelector("button");

      if (firstButton) {
        firstButton.focus({ preventScroll: true });
      }
    });
  </script>
</body>
</html>
